# Nastavení serverových funkcí (Supabase CLI: `supabase functions deploy`).
# Ověření JWT na bráně je vypnuté: club-api si přihlášení ověřuje sama (auth.getUser),
# webhook ověřuje podpis Stripe. Funguje tak i s novými klíči Supabase (publishable / secret).
[functions.club-api]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
